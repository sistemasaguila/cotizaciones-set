name: Update rates

on:
  schedule:
    - cron:  '0 5 * * *'
    - cron:  '0 10 * * *'
    - cron:  '0 11 * * *'
    - cron:  '0 12 * * *'
    - cron:  '0 13 * * *'
    - cron:  '0 16 * * *'
    - cron:  '0 20 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run scraper
        run: uv run src/main.py

      - name: Commit changes
        uses: EndBug/add-and-commit@v11
        with:
          author_name: github-actions[bot]
          author_email: github-actions[bot]@users.noreply.github.com
          message: 'Update rates'
          add: '.'
